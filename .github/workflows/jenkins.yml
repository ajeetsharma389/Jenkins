

name: 'Build and Deploy to Registry'

on:
  push:
    branches:
      - master


jobs:
  setup-build-publish-deploy:
    name: 'Setup, Build, Publish, and Deploy'
    runs-on: 'ubuntu-latest'
    environment: 'dev'

    #permissions:
